# Builds OGChecker.exe on GitHub's Windows machines and publishes it as a Release.
name: Build Windows app

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/**", "README.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm OGChecker.spec
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: og//checker v1.${{ github.run_number }}
          files: dist/OGChecker.exe
          make_latest: true
